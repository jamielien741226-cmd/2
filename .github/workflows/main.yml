name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS App (unsigned)
        run: |
          xcodebuild clean archive \
            -project HikingGPX.xcodeproj \
            -scheme HikingGPX \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/HikingGPX.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/HikingGPX.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ../HikingGPX-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikingGPX-unsigned-ipa
          path: HikingGPX-unsigned.ipa
          retention-days: 3
