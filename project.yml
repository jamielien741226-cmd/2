name: BaiyueNav
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BaiyueNav:
    type: application
    platform: iOS
    sources:
      - BaiyueNav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.baiyuenav
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 百岳導航
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 需要您的位置來顯示路線進度、偵測偏離路線並錄製軌跡。
        NSLocationAlwaysAndWhenInUseUsageDescription: 登山時畫面可能關閉，需要在背景持續定位以完整錄製軌跡。
        UIBackgroundModes:
          - location
