name: BaiyueNav
options:
  bundleIdPrefix: com.local.baiyuenav
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.local.baiyuenav.app

targets:
  BaiyueNav:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - ".github/**"
          - "build/**"
          - "project.yml"
          - "*.md"
          - "**/*.md"
          - "*.sample"
          - "**/*.sample"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_NAME: BaiyueNav
        INFOPLIST_FILE: Info.plist
